<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learning Log</title>
</head>
<body>
    {% extends "learning_logs/base.html" %}

    {% block content %}
        Tópicos:
       <ul>
            {% for topic in topics %}
            <li>
                {{ topic }}
            </li>

            {% empty %}
            <li>
                Não há topicos adicionados
            </li>
            {% endfor %}
       </ul> 
    {% endblock %}
</body>
</html>
